# render.yaml
# Render.com deployment configuration
# Commit this file to your repo — Render reads it automatically on connect.

services:
  - type: web
    name: spitewise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: MONGODB_URI
        sync: false                # You fill this in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production